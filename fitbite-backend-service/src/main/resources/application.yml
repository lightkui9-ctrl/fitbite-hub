server:
  port: 8080

spring:
  application:
    name: fitbite-backend-service

  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fitbite_db?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsZero=true&serverTimezone=GMT%2B8
    username: root
    password: 1234  # ⚠️ 请修改为您本地 MySQL 的真实密码

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志
    map-underscore-to-camel-case: true

# Python AI 微服务地址[cite: 2]
ai-service:
  base-url: http://localhost:8001

# JWT 配置（用户登录鉴权）
jwt:
  # 签名密钥，需 >= 32 字节。生产环境请替换为强随机密钥并妥善保管
  secret: fitbite-jwt-secret-key-2026-strong-enough-not-for-prod-use-please-change
  # Token 有效期（毫秒），默认 7 天
  expiration: 604800000